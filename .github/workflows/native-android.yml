name: Native Android (Kotlin)

# Build Android từ repo Kotlin (gitlab.uniscore.tv/uniscore-mobile/uniscore-kotlin) — thay phần Android của ci.yml (RN).
# Kích hoạt: tag v<ver>-<dev|stag|beta|prod>+N ở repo Kotlin → job GitLab `trigger_android_release` gọi workflow này.
#   dev / stag / beta → APK, versionCode YYMMDDNN → Firebase App Distribution (cùng app + group UniTester với RN) + Diawi
#   prod              → AAB, versionCode = cao nhất trên Play + 1 → Play Internal testing (không bao giờ production)
# .env, keystore dev/beta/staging và lane fastlane lấy từ repo RN (một nguồn duy nhất, giống hệt bản Kotlin đang dùng).
# Tên job giữ "init" / "Deployment APK|AAB" / "Send Combined Notification" để Hub /release (site/ci.js) tự nhận.

on:
  workflow_dispatch:
    inputs:
      ref_name:
        description: "Tag repo Kotlin (v<ver>-<env>+N)"
        required: true
      committer_name:
        description: "Người tạo tag"
        required: true
        default: "Unknown"
      rn_ref:
        description: "Nhánh repo RN lấy .env / keystore / fastlane (trống = nhánh mặc định)"
        required: false
        default: ""
env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  REF_NAME: ${{ github.event.inputs.ref_name }}
  COMMITTER_NAME: ${{ github.event.inputs.committer_name }}
  RN_REF: ${{ github.event.inputs.rn_ref }}
  GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
  KOTLIN_GITLAB_TOKEN: ${{ secrets.KOTLIN_GITLAB_TOKEN }}
  KOTLIN_REPO: gitlab.uniscore.tv/uniscore-mobile/uniscore-kotlin.git
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_GROUP_ID: ${{ vars.TELEGRAM_GROUP_ID }}
  TELEGRAM_TOPIC_ID: ${{ vars.TELEGRAM_TOPIC_ID }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set-env.outputs.env }}
      format: ${{ steps.set-env.outputs.format }}
      message-information: ${{ steps.set-env.outputs.info }}
      release-notes: ${{ steps.gen-notes.outputs.notes }}
      build-mood: ${{ steps.gen-notes.outputs.mood }}
    steps:
      - name: Clone Kotlin repository
        run: git clone --depth 30 --branch "$REF_NAME" "https://oauth2:${KOTLIN_GITLAB_TOKEN}@${KOTLIN_REPO}" uniscore-kotlin

      - name: Set env
        id: set-env
        run: |
          # Tag format v<version>-<env>+<build>; an unknown suffix fails instead of silently building dev
          if [[ "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-(dev|stag|beta|prod)\+([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}" ENV="${BASH_REMATCH[2]}" BUILD="${BASH_REMATCH[3]}"
          else
            echo "::error::Tag '$REF_NAME' must be v<version>-<dev|stag|beta|prod>+<build>"
            exit 1
          fi
          FORMAT=APK; [[ "$ENV" == prod ]] && FORMAT=AAB
          LINK_ACTION="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "format=$FORMAT" >> $GITHUB_OUTPUT
          echo "info=\n- App: Uniscore Android (Kotlin native).\n- Môi trường: $ENV.\n- Phiên bản: $VERSION ($BUILD).\n- Tag: ${REF_NAME}.\n- Link action: $LINK_ACTION." >> $GITHUB_OUTPUT

      - name: Generate Release Notes & Mood
        id: gen-notes
        working-directory: uniscore-kotlin
        run: |
          COMMITS=$(git log -n 10 --no-merges --pretty=format:"- %s" || echo "")
          [[ -z "$COMMITS" ]] && COMMITS="- Cập nhật hệ thống."

          ask() { # $1 = prompt; Gemini → Groq, rỗng nếu cả hai lỗi
            local out
            jq -n --arg p "$1" '{contents: [{parts: [{text: $p}]}]}' > payload.json
            for model in gemini-flash-latest gemini-flash-lite-latest; do
              out=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=$GEMINI_API_KEY" \
                -H "Content-Type: application/json" -d @payload.json | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null)
              [[ -n "$out" ]] && { echo "$out"; return; }
            done
            jq -n --arg p "$1" '{model: "llama-3.3-70b-versatile", messages: [{role: "user", content: $p}], temperature: 0.7}' > payload.json
            curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" -H "Authorization: Bearer $GROQ_API_KEY" \
              -H "Content-Type: application/json" -d @payload.json | jq -r '.choices[0].message.content // empty' 2>/dev/null
          }

          NOTES=$(ask "Bạn là một AI chuyên nghiệp. Hãy viết bản tóm tắt 'Tính năng mới & Cập nhật' $REF_NAME (app Android) ngắn gọn, súc tích bằng tiếng Việt. Yêu cầu: bắt đầu mỗi dòng bằng dấu gạch đầu dòng (-), nếu thay đổi liên quan đến task thì BẮT BUỘC bắt đầu bằng mã task (ví dụ: - US-1663: Sửa lỗi ...). Tối đa 10 dòng, mỗi dòng không quá 100 ký tự. Không đề cập mã nguồn hay commit. Không dùng markdown phức tạp.\n\nDanh sách thay đổi:\n$COMMITS")
          NOTES="${NOTES:-- Cập nhật hệ thống và cải tiến hiệu năng.}"
          MOOD=$(ask "Dựa trên các danh sách thay đổi sau, hãy đặt một cái tên tóm tắt nội dung chính một cách chuyên nghiệp bằng tiếng Việt cho bản build này kèm emoji phù hợp. Chỉ trả về duy nhất cái tên, tối đa 60 ký tự, không có mã task.\n\nDanh sách thay đổi:\n$COMMITS")
          MOOD="${MOOD:-Cập nhật Uniscore Android 🤖}"
          { echo "notes<<EOF"; echo "$NOTES" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; echo "EOF"; } >> "$GITHUB_OUTPUT"
          { echo "mood<<EOF"; echo "$MOOD" | head -n 1; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Log value
        run: |
          echo "tag-source: $REF_NAME"
          echo "source: kotlin"
          echo "env: ${{ steps.set-env.outputs.env }}"

      - name: Send telegram message
        env:
          MESSAGE: "🎬 <b>Bắt đầu build 🤖 Android · Kotlin:</b> ${{ steps.set-env.outputs.info }}\n- Thanh niên ấn build 👨‍💻: ${{ env.COMMITTER_NAME || 'Unknown' }}"
        run: |
          jq -n --arg chat_id "${TELEGRAM_GROUP_ID}" \
                --arg thread_id "${TELEGRAM_TOPIC_ID}" \
                --arg text "$(echo -e "$MESSAGE")" \
                --arg callback_data "cancel_confirm:${{ github.run_id }}" \
                '{chat_id: $chat_id, message_thread_id: $thread_id, text: $text, parse_mode: "HTML", disable_web_page_preview: true,
                  reply_markup: {inline_keyboard: [[{text: "❌ Hủy workflow nha bro", callback_data: $callback_data}]]}}' > payload.json
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -H "Content-Type: application/json" -d @payload.json

  deploy:
    name: Deployment ${{ needs.init.outputs.format }} (Kotlin)
    runs-on: ubuntu-latest
    needs: [init]
    timeout-minutes: 75
    env:
      ENV: ${{ needs.init.outputs.env }}
      FORMAT: ${{ needs.init.outputs.format }}
    steps:
      - name: Set Start Time
        run: echo "JOB_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Clone repositories
        run: |
          git clone --depth 1 --branch "$REF_NAME" "https://oauth2:${KOTLIN_GITLAB_TOKEN}@${KOTLIN_REPO}" uniscore-kotlin
          git clone --depth 1 ${RN_REF:+--branch "$RN_REF"} "https://oauth2:${GITLAB_TOKEN}@gitlab.com/unity1185445/uniscore-mobile.git" uniscore-mobile
          echo "Kotlin @ $(git -C uniscore-kotlin rev-parse --short HEAD) · RN config @ $(git -C uniscore-mobile rev-parse --abbrev-ref HEAD) $(git -C uniscore-mobile rev-parse --short HEAD)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Setup ruby (fastlane của repo RN)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
          bundler-cache: true
          working-directory: uniscore-mobile

      - name: Prepare config (.env, release notes)
        env:
          RAW_RELEASE_NOTES: ${{ needs.init.outputs.release-notes }}
        run: |
          case "$ENV" in
            dev) DOTENV=.env.development FLAVOR=Dev ;;
            stag) DOTENV=.env.staging FLAVOR=Staging ;;
            beta) DOTENV=.env.beta FLAVOR=Beta ;;
            prod) DOTENV=.env.production FLAVOR=Prod ;;
          esac
          [[ "$REF_NAME" =~ ^v(([0-9]+)\.([0-9]+)\.([0-9]+))-[a-z]+\+([0-9]+)$ ]]
          VERSION="${BASH_REMATCH[1]}"
          # dev/stag/beta: versionCode YYMMDDNN (tag vYY.MM.DD-env+N) — luôn tăng nên bản sau cài đè được bản trước,
          # và lớn hơn mọi bản RN (RN dùng N). Prod: ghi đè ở bước "Set versionCode from Google Play".
          CODE=$(( 10#${BASH_REMATCH[2]} * 1000000 + 10#${BASH_REMATCH[3]} * 10000 + 10#${BASH_REMATCH[4]} * 100 + 10#${BASH_REMATCH[5]} ))
          {
            echo "FLAVOR=$FLAVOR"
            echo "FLAVOR_LC=$(echo "$FLAVOR" | tr '[:upper:]' '[:lower:]')"
            echo "VERSION_NAME=$VERSION"
            echo "VERSION_CODE=$CODE"
          } >> $GITHUB_ENV
          # Release chỉ nạp .env khi có -PreleaseDomains=true (core/network/uniscore-env.gradle.kts)
          cp "uniscore-mobile/$DOTENV" "uniscore-kotlin/$DOTENV"
          perl -i -pe "s/^\s*VERSION(_ANDROID)?\s*=.*$/VERSION\$1=${VERSION}/" "uniscore-kotlin/$DOTENV"
          echo "sdk.dir=$ANDROID_HOME" > uniscore-kotlin/local.properties
          # fastlane fetch_whats_new đọc release_notes.txt ở gốc repo RN
          echo "$RAW_RELEASE_NOTES" > uniscore-mobile/release_notes.txt

      # Prod: versionCode tiếp nối Play (cao nhất trên mọi track + 1), giống bản RN
      - name: Set versionCode from Google Play
        if: env.ENV == 'prod'
        working-directory: uniscore-mobile
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          bundle exec fastlane android prod_next_version_code
          echo "VERSION_CODE=$(cat android_version_code.txt)" >> $GITHUB_ENV

      - name: Change version and build number
        working-directory: uniscore-kotlin
        run: |
          perl -i -pe "s/^(\s*versionCode\s*=\s*)\d+/\${1}${VERSION_CODE}/; s/^(\s*versionName\s*=\s*)\"[^\"]*\"/\${1}\"${VERSION_NAME}\"/" app/build.gradle.kts
          grep -nE "^\s*version(Code|Name) =" app/build.gradle.kts

      # Ký như RN: dev/beta = debug.keystore của RN, staging = staging.keystore (mật khẩu trong android/gradle.properties
      # của RN), prod = upload key (secret). Truyền bằng android.injected.signing.* nên repo Kotlin không cần signingConfig.
      - name: Signing config
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          RN_APP="$PWD/uniscore-mobile/android/app"
          prop() { grep -E "^$1=" uniscore-mobile/android/gradle.properties | head -n 1 | cut -d= -f2- | tr -d '\r'; }
          case "$ENV" in
            prod)
              echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
              FILE="$RUNNER_TEMP/upload.keystore" SP="$ANDROID_UPLOAD_STORE_PASSWORD" ALIAS="$ANDROID_UPLOAD_KEY_ALIAS" KP="$ANDROID_UPLOAD_KEY_PASSWORD" ;;
            stag)
              FILE="$RN_APP/$(prop STAGING_UPLOAD_STORE_FILE)" SP="$(prop STAGING_UPLOAD_STORE_PASSWORD)" ALIAS="$(prop STAGING_UPLOAD_KEY_ALIAS)" KP="$(prop STAGING_UPLOAD_KEY_PASSWORD)" ;;
            *)
              FILE="$RN_APP/debug.keystore" SP=android ALIAS=androiddebugkey KP=android ;;
          esac
          [[ -s "$FILE" && -n "$SP" && -n "$ALIAS" ]] || { echo "::error::Thiếu keystore cho $ENV"; exit 1; }
          echo "::add-mask::$SP"; echo "::add-mask::$KP"
          {
            echo "SIGN_STORE_FILE=$FILE"
            echo "SIGN_STORE_PASSWORD=$SP"
            echo "SIGN_KEY_ALIAS=$ALIAS"
            echo "SIGN_KEY_PASSWORD=$KP"
          } >> $GITHUB_ENV

      - name: Build ${{ needs.init.outputs.format }}
        working-directory: uniscore-kotlin
        run: |
          TASK=":app:assemble${FLAVOR}Release"; [[ "$FORMAT" == AAB ]] && TASK=":app:bundle${FLAVOR}Release"
          ./gradlew "$TASK" -PreleaseDomains=true \
            -Pandroid.injected.signing.store.file="$SIGN_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$SIGN_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$SIGN_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SIGN_KEY_PASSWORD"

      # Lane fastlane của RN đọc file theo đường dẫn android/app/build/outputs/... — chép bản Kotlin vào đúng chỗ đó
      - name: Stage artifact for fastlane
        run: |
          if [[ "$FORMAT" == AAB ]]; then
            SRC="uniscore-kotlin/app/build/outputs/bundle/${FLAVOR_LC}Release/app-${FLAVOR_LC}-release.aab"
            DST="uniscore-mobile/android/app/build/outputs/bundle/${FLAVOR_LC}Release/"
          else
            SRC="uniscore-kotlin/app/build/outputs/apk/${FLAVOR_LC}/release/app-${FLAVOR_LC}-release.apk"
            DST="uniscore-mobile/android/app/build/outputs/apk/${FLAVOR_LC}/release/"
          fi
          mkdir -p "$DST" && cp "$SRC" "$DST"
          echo "ARTIFACT_PATH=$SRC" >> $GITHUB_ENV
          ls -la "$DST"

      - name: Deploy apk to Firebase App Distribution
        if: env.FORMAT == 'APK'
        working-directory: uniscore-mobile
        run: |
          LANE=$ENV; [[ "$ENV" == stag ]] && LANE=staging
          bundle exec fastlane android "$LANE"

      # Prod: internal testing track only; the lane never touches production
      - name: Upload AAB to Google Play internal testing
        if: env.FORMAT == 'AAB'
        working-directory: uniscore-mobile
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android prod_internal

      - name: Calculate Build Stats
        if: ${{ success() }}
        run: |
          DURATION=$(( $(date +%s) - JOB_START_TIME ))
          echo "BUILD_DURATION=$((DURATION / 60))m $((DURATION % 60))s" >> $GITHUB_ENV
          echo "BUILD_SIZE=$(du -sh "$ARTIFACT_PATH" | cut -f1)" >> $GITHUB_ENV

      - name: Upload to Diawi
        if: ${{ env.FORMAT == 'APK' && success() }}
        env:
          DIAWI_TOKEN: ${{ secrets.DIAWI_TOKEN }}
        run: |
          JOB_ID=$(curl -s -X POST https://upload.diawi.com/ -F "token=${DIAWI_TOKEN}" -F "file=@${ARTIFACT_PATH}" \
            -F "find_by_udid=0" -F "wall_of_apps=0" | jq -r '.job // empty')
          [[ -n "$JOB_ID" ]] || { echo "⚠️ Diawi upload failed"; exit 0; }
          for i in {1..30}; do
            sleep 5
            R=$(curl -s "https://upload.diawi.com/status?token=${DIAWI_TOKEN}&job=${JOB_ID}")
            case "$(echo "$R" | jq -r '.status // empty')" in
              2000)
                echo "DIAWI_LINK=$(echo "$R" | jq -r '.link // empty')" >> $GITHUB_ENV
                echo "DIAWI_QR=$(echo "$R" | jq -r '.qrcode // empty')" >> $GITHUB_ENV
                exit 0 ;;
              4000) echo "⚠️ Diawi processing failed: $(echo "$R" | jq -r '.message // empty')"; exit 0 ;;
            esac
          done
          echo "⚠️ Timeout waiting for Diawi link"

      - name: Send telegram message
        if: ${{ success() }}
        run: |
          DESTINATION="App Distribution"; [[ "$FORMAT" == AAB ]] && DESTINATION="CH Play Internal testing"
          PREVIEW=""; [[ -n "$DIAWI_QR" ]] && PREVIEW="<a href=\"$DIAWI_QR\">&#8205;</a>"
          MESSAGE="${PREVIEW}✅ <b>Build thành công ${FORMAT} 🤖 Android · Kotlin rồi hàng đã có trên ${DESTINATION}:</b>\n${{ needs.init.outputs.message-information }}\n- versionCode: ${VERSION_CODE} · ${BUILD_SIZE} · ${BUILD_DURATION}"
          [[ -n "$DIAWI_LINK" ]] && MESSAGE="$MESSAGE\n\n🔗 <b>Diawi Link:</b> <a href=\"$DIAWI_LINK\">Cài đặt trực tiếp qua Diawi</a>"
          jq -n --arg chat_id "${TELEGRAM_GROUP_ID}" --arg thread_id "${TELEGRAM_TOPIC_ID}" --arg text "$(echo -e "$MESSAGE")" \
            '{chat_id: $chat_id, message_thread_id: $thread_id, text: $text, parse_mode: "HTML", disable_web_page_preview: false}' > payload.json
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -H "Content-Type: application/json" -d @payload.json

      - name: Send telegram message failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STEP=$(gh run view ${{ github.run_id }} --json jobs -R ${{ github.repository }} \
            | jq -r '[.jobs[] | select(.name | startswith("Deployment")) | .steps[] | select(.conclusion == "failure") | .name][0] // "?"')
          STEP=$(echo "$STEP" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          MESSAGE="💥 <b>Build thất bại:</b> ${FORMAT} (🤖 Android · Kotlin)\n${{ needs.init.outputs.message-information }}\n\n❌ <b>Bước lỗi:</b> ${STEP}\n🔗 Xem chi tiết: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n --arg chat_id "${TELEGRAM_GROUP_ID}" --arg thread_id "${TELEGRAM_TOPIC_ID}" --arg text "$(echo -e "$MESSAGE")" \
            '{chat_id: $chat_id, message_thread_id: $thread_id, text: $text, parse_mode: "HTML", disable_web_page_preview: true}' > payload.json
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -H "Content-Type: application/json" -d @payload.json

  notify:
    name: Send Combined Notification
    runs-on: ubuntu-latest
    needs: [init, deploy]
    if: always() && !cancelled() && needs.init.result == 'success'
    steps:
      - name: Prepare Release Notes & Build Message
        env:
          RAW_RELEASE_NOTES: ${{ needs.init.outputs.release-notes }}
          RAW_BUILD_MOOD: ${{ needs.init.outputs.build-mood }}
          RAW_VERSION_INFO: ${{ needs.init.outputs.message-information }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          ENV: ${{ needs.init.outputs.env }}
        run: |
          esc() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/\"/\&quot;/g'; }
          NOTES=$(echo "$RAW_RELEASE_NOTES" | esc); NOTES="${NOTES:0:1500}"
          MOOD=$(echo "$RAW_BUILD_MOOD" | esc); MOOD="${MOOD:0:60}"
          STATUS="❌ Thất bại"; [[ "$DEPLOY_RESULT" == success ]] && STATUS="✅ Sẵn sàng"
          case "$ENV" in
            dev) ENV_LABEL="🛠️ Development" ;; stag) ENV_LABEL="🧪 Staging" ;;
            beta) ENV_LABEL="🎯 Beta" ;; prod) ENV_LABEL="🚀 Production" ;; *) ENV_LABEL="📦 $ENV" ;;
          esac
          {
            echo "TELEGRAM_MESSAGE<<EOF"
            echo "🎉 <b>${MOOD}</b>"
            echo ""
            echo "🤖 <b>Android (Kotlin):</b> ${STATUS}"
            echo ""
            echo -e "$(echo "$RAW_VERSION_INFO" | esc)"
            echo "🌍 <b>Môi trường:</b> ${ENV_LABEL}"
            [[ "$ENV" == prod ]] && echo "📍 <b>Nơi nhận:</b> CH Play Internal testing"
            echo "🕐 <b>Thời gian:</b> $(TZ='Asia/Ho_Chi_Minh' date '+%d/%m/%Y %H:%M')"
            echo ""
            echo "📝 <b>Có gì mới:</b>"
            echo "${NOTES}"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Send combined Telegram notification
        run: |
          jq -n --arg chat_id "${TELEGRAM_GROUP_ID}" --arg thread_id "${TELEGRAM_TOPIC_ID}" --arg text "${TELEGRAM_MESSAGE}" \
            '{chat_id: $chat_id, message_thread_id: $thread_id, text: $text, parse_mode: "HTML", disable_web_page_preview: true}' > payload.json
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -H "Content-Type: application/json" -d @payload.json
